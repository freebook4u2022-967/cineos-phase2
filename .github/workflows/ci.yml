name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install '.[dev]' build
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: pytest --junitxml=pytest-results.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: pytest-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce pytest result
        if: steps.pytest.outcome != 'success'
        run: exit 1
      - run: ruff check .
      - run: black --check .
      - run: python -m build
      - run: python -c "import cineos, cineos.benchmarks, cineos.release"
      - run: cineos version && cineos demo --output-dir /tmp/demo
