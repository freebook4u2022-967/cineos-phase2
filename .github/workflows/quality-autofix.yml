name: Quality autofix

on:
  push:
    branches:
      - codex/short-drama-agent-sprint-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/short-drama-agent-sprint-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality tools
        run: pip install '.[dev]'
      - name: Apply Ruff safe fixes
        run: ruff check . --fix || true
      - name: Apply Black formatting
        run: black .
      - name: Commit quality normalization
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Normalize quality formatting'
          git push origin HEAD:codex/short-drama-agent-sprint-1
