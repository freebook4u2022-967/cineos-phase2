[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cineos"
version = "0.1.0"
description = "Foundation for the CINEOS Phase 2 cinematic production platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "CINEOS contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
cineos = "cineos.cli.main:main"

[project.optional-dependencies]
dev = [
  "black>=24.4,<26",
  "pytest>=8.2,<9",
  "ruff>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cineos"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 88
