name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install '.[dev]' build
      - run: pytest
      - run: ruff check .
      - run: black --check .
      - run: python -m build
      - run: python -c "import cineos, cineos.benchmarks, cineos.release"
      - run: cineos version && cineos demo --output-dir /tmp/demo
